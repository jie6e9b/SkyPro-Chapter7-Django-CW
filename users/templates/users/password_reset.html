{% extends "base.html" %}
{% block title %}Сброс пароля{% endblock %}
{% block content %}
<h2>Восстановление пароля</h2>
<p>Введите email, указанный при регистрации. Мы отправим ссылку для сброса пароля.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Отправить</button>
</form>
{% endblock %}
