{% extends "base.html" %}
{% block title %}Удаление клиента{% endblock %}
{% block content %}
<h2>Удаление клиента: {{ object.full_name }}</h2>
<p>Вы уверены, что хотите удалить этого клиента?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'client_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
